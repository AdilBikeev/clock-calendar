<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4285f4;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .button:hover {
      background: #357ae8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Завершение авторизации...</p>
    <button id="openApp" class="button" style="display: none;">Открыть приложение</button>
  </div>

  <script>
    // Извлекаем параметры из URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');

    if (error) {
      document.querySelector('p').textContent = 'Ошибка авторизации: ' + error;
      document.getElementById('openApp').style.display = 'block';
      document.getElementById('openApp').textContent = 'Закрыть';
      document.getElementById('openApp').onclick = () => window.close();
      return;
    }

    if (code && state) {
      // Формируем deep link для возврата в приложение
      const deepLink = `com.clockcalendar.app://oauth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
      
      // Пытаемся открыть приложение через deep link
      window.location.href = deepLink;
      
      // Если через 2 секунды приложение не открылось, показываем кнопку
      setTimeout(() => {
        document.getElementById('openApp').style.display = 'block';
        document.getElementById('openApp').onclick = () => {
          window.location.href = deepLink;
        };
      }, 2000);
    } else {
      document.querySelector('p').textContent = 'Неверные параметры авторизации';
      document.getElementById('openApp').style.display = 'block';
      document.getElementById('openApp').textContent = 'Закрыть';
      document.getElementById('openApp').onclick = () => window.close();
    }
  </script>
</body>
</html>
